<svg viewBox="0 0 900 450" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .axis { stroke: #3f3f46; stroke-width: 1.2; }
    .grid { stroke: #e4e4e7; stroke-width: 1; }
    .tick { fill: #71717a; font-size: 12px; }
    .axlab { fill: #3f3f46; font-size: 13px; font-weight: 600; }
    .title { fill: #18181b; font-size: 15px; font-weight: 700; }
    .panel { fill: #a1a1aa; font-size: 14px; font-weight: 700; }
    .note { fill: #a1a1aa; font-size: 11px; font-style: italic; }
    .leg { fill: #3f3f46; font-size: 12px; }
    .ours { stroke: #c2410c; stroke-width: 2.6; fill: none; }
    .base { stroke: #71717a; stroke-width: 1.8; fill: none; stroke-dasharray: 6 4; }
    .human { stroke: #0e7490; stroke-width: 1.8; fill: none; stroke-dasharray: 2 3; }
    .dot { fill: #c2410c; }
    .band { fill: #c2410c; opacity: 0.10; }
    .sat { stroke: #a1a1aa; stroke-width: 1; stroke-dasharray: 3 3; }
  </style>

  <text class="title" x="40" y="34">Closed-loop evaluation on held-out laboratory measurements</text>

  <!-- ============ PANEL A ============ -->
  <text class="panel" x="70" y="78">A</text>
  <text class="axlab" x="92" y="78">Hit rate per round</text>

  <!-- grid + y ticks: 0,15,30,45,60 % -->
  <line class="grid" x1="70" y1="340" x2="420" y2="340"/>
  <line class="grid" x1="70" y1="270" x2="420" y2="270"/>
  <line class="grid" x1="70" y1="200" x2="420" y2="200"/>
  <line class="grid" x1="70" y1="130" x2="420" y2="130"/>
  <line class="grid" x1="70" y1="100" x2="420" y2="100"/>
  <text class="tick" x="62" y="344" text-anchor="end">0</text>
  <text class="tick" x="62" y="274" text-anchor="end">15</text>
  <text class="tick" x="62" y="204" text-anchor="end">30</text>
  <text class="tick" x="62" y="134" text-anchor="end">45</text>
  <text class="tick" x="62" y="104" text-anchor="end">60</text>
  <text class="axlab" x="22" y="230" transform="rotate(-90 22 230)" text-anchor="middle">designs that bind (%)</text>

  <line class="axis" x1="70" y1="340" x2="420" y2="340"/>
  <line class="axis" x1="70" y1="90" x2="70" y2="340"/>

  <!-- saturation marker -->
  <line class="sat" x1="320" y1="95" x2="320" y2="340"/>
  <text class="note" x="326" y="110">saturation</text>

  <!-- uncertainty band around ours -->
  <path class="band" d="M70,297 L120,261 L170,203 L220,154 L270,121 L320,102 L370,97 L420,92
                        L420,74 L370,79 L320,83 L270,101 L220,134 L170,183 L120,241 L70,280 Z"/>

  <!-- ours -->
  <polyline class="ours" points="70,288.7 120,251.3 170,193.3 220,144 270,111.3 320,92.7 370,88 420,83.3"/>
  <circle class="dot" cx="70" cy="288.7" r="4"/>
  <circle class="dot" cx="120" cy="251.3" r="4"/>
  <circle class="dot" cx="170" cy="193.3" r="4"/>
  <circle class="dot" cx="220" cy="144" r="4"/>
  <circle class="dot" cx="270" cy="111.3" r="4"/>
  <circle class="dot" cx="320" cy="92.7" r="4"/>
  <circle class="dot" cx="370" cy="88" r="4"/>
  <circle class="dot" cx="420" cy="83.3" r="4"/>

  <!-- baselines -->
  <polyline class="base" points="70,288.7 420,288.7"/>
  <polyline class="human" points="70,278.4 420,278.4"/>
  <text class="tick" x="416" y="303" text-anchor="end">random draw from pool</text>
  <text class="tick" x="416" y="272" text-anchor="end" fill="#0e7490">published human cohort</text>

  <!-- x ticks -->
  <text class="tick" x="70" y="360" text-anchor="middle">0</text>
  <text class="tick" x="120" y="360" text-anchor="middle">1</text>
  <text class="tick" x="170" y="360" text-anchor="middle">2</text>
  <text class="tick" x="220" y="360" text-anchor="middle">3</text>
  <text class="tick" x="270" y="360" text-anchor="middle">4</text>
  <text class="tick" x="320" y="360" text-anchor="middle">5</text>
  <text class="tick" x="370" y="360" text-anchor="middle">6</text>
  <text class="tick" x="420" y="360" text-anchor="middle">7</text>
  <text class="axlab" x="245" y="383" text-anchor="middle">simulated design–test–learn round</text>

  <!-- ============ PANEL B ============ -->
  <text class="panel" x="520" y="78">B</text>
  <text class="axlab" x="542" y="78">Best affinity found so far</text>

  <line class="grid" x1="520" y1="340" x2="870" y2="340"/>
  <line class="grid" x1="520" y1="270" x2="870" y2="270"/>
  <line class="grid" x1="520" y1="200" x2="870" y2="200"/>
  <line class="grid" x1="520" y1="130" x2="870" y2="130"/>
  <line class="grid" x1="520" y1="100" x2="870" y2="100"/>
  <text class="tick" x="512" y="344" text-anchor="end">1 nM</text>
  <text class="tick" x="512" y="274" text-anchor="end">10 nM</text>
  <text class="tick" x="512" y="204" text-anchor="end">100 nM</text>
  <text class="tick" x="512" y="134" text-anchor="end">1 µM</text>
  <text class="tick" x="512" y="104" text-anchor="end">10 µM</text>
  <text class="axlab" x="466" y="230" transform="rotate(-90 466 230)" text-anchor="middle">best K&#8332; (log scale)</text>

  <line class="axis" x1="520" y1="340" x2="870" y2="340"/>
  <line class="axis" x1="520" y1="90" x2="520" y2="340"/>

  <line class="sat" x1="770" y1="95" x2="770" y2="340"/>
  <text class="note" x="776" y="110">saturation</text>

  <polyline class="ours" points="520,109 570,145.5 620,194.5 670,232 720,273 770,294 820,299 870,301"/>
  <circle class="dot" cx="520" cy="109" r="4"/>
  <circle class="dot" cx="570" cy="145.5" r="4"/>
  <circle class="dot" cx="620" cy="194.5" r="4"/>
  <circle class="dot" cx="670" cy="232" r="4"/>
  <circle class="dot" cx="720" cy="273" r="4"/>
  <circle class="dot" cx="770" cy="294" r="4"/>
  <circle class="dot" cx="820" cy="299" r="4"/>
  <circle class="dot" cx="870" cy="301" r="4"/>

  <polyline class="base" points="520,109 570,122 620,139 670,158 720,176 770,190 820,201 870,210"/>
  <text class="tick" x="866" y="205" text-anchor="end">random draw from pool</text>

  <!-- ceiling -->
  <line class="human" x1="520" y1="312" x2="870" y2="312"/>
  <text class="tick" x="866" y="328" text-anchor="end" fill="#0e7490">best binder present in pool</text>

  <text class="tick" x="520" y="360" text-anchor="middle">0</text>
  <text class="tick" x="570" y="360" text-anchor="middle">1</text>
  <text class="tick" x="620" y="360" text-anchor="middle">2</text>
  <text class="tick" x="670" y="360" text-anchor="middle">3</text>
  <text class="tick" x="720" y="360" text-anchor="middle">4</text>
  <text class="tick" x="770" y="360" text-anchor="middle">5</text>
  <text class="tick" x="820" y="360" text-anchor="middle">6</text>
  <text class="tick" x="870" y="360" text-anchor="middle">7</text>
  <text class="axlab" x="695" y="383" text-anchor="middle">simulated design–test–learn round</text>

  <!-- legend -->
  <line class="ours" x1="70" y1="412" x2="110" y2="412"/>
  <circle class="dot" cx="90" cy="412" r="4"/>
  <text class="leg" x="118" y="416">our system (closed loop)</text>
  <line class="base" x1="300" y1="412" x2="340" y2="412"/>
  <text class="leg" x="348" y="416">no-learning control</text>
  <line class="human" x1="500" y1="412" x2="540" y2="412"/>
  <text class="leg" x="548" y="416">reference from published campaign</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
